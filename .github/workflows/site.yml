# ─────────────────────────────────────────────────────────────
#  홈페이지 자동 만들기·올리기
#
#  언제 도나: main 에 push 될 때마다
#    - 사장님이 관리 화면(구글 Apps Script)에서 가격·사례를 저장할 때
#      (관리 화면이 GitHub API 로 content/*.json 과 _uploads/ 사진을 main 에 커밋한다)
#    - 내 PC 에서 git push 할 때
#    - Actions 탭에서 'Run workflow' 를 누를 때
#    (_uploads/ 에 사진만 올라온 push 는 건너뛴다. 사례를 저장할 때 같이 처리된다)
#
#  하는 일
#    0. 생성되는 파일(index.html, toilet/index.html 등)을 push 에서 직접 고쳤는지 확인 → 고쳤으면 멈춤
#    1. 새로 올린 사진 줄이기          _tools/process_photos.py --write
#    2. 가격·사례로 홈+서비스 8장 만들기 _tools/build_content.py --write
#    3. 지역 9장 만들기                _tools/build_pages.py --write
#    4. 바뀐 파일이 있으면 main 에 자동 커밋
#    5. 사이트를 GitHub Pages 에 올리기 (지금까지와 같은 Jekyll 방식, content/ 폴더는 빼고)
#
#  가격·사례 원본은 content/prices.json, content/cases/<페이지>.json (2026-10-27 yml → json.
#  Apps Script 에는 yml 을 읽는 도구가 없어서 바꿨다. 그래서 이 작업도 PyYAML 이 필요 없다)
#
#  왜 5번을 이 작업이 직접 하나
#    GitHub 문서(Configuring a publishing source for your GitHub Pages site):
#    "Commits pushed by a GitHub Actions workflow that uses the GITHUB_TOKEN do not trigger a GitHub Pages build."
#    그래서 4번 자동 커밋만으로는 사이트가 안 바뀐다. 저장소 설정 Pages 의 Source 를 'GitHub Actions' 로 바꾸고
#    이 작업이 직접 올린다. 이 설정이 'Deploy from a branch' 로 남아 있으면 5번은 실패하고 사이트는 그대로다.
#
#  자동 커밋이 이 작업을 다시 부르지 않나 (무한 반복)
#    GITHUB_TOKEN 으로 한 push 는 새 작업을 만들지 않는다(GitHub 문서 'Triggering a workflow').
#    혹시 몰라 github-actions[bot] 이 한 push 면 건너뛰는 조건도 넣었다.
#
#  둘이 거의 동시에 저장하면: concurrency 로 한 번에 하나씩 돈다. 4번 push 가 밀리면
#  (그 사이 새 커밋이 있으면) 이번 것은 올리지 않고, 뒤이어 도는 작업이 최신 상태로 다시 만든다.
# ─────────────────────────────────────────────────────────────
name: 홈페이지 만들기·올리기

on:
  push:
    branches: [main]
    paths-ignore:
      - "_uploads/**"
  workflow_dispatch:

permissions:
  contents: write     # 4. 자동 커밋
  pages: write        # 5. 올리기
  id-token: write     # 5. 올리기

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치 (사진 읽기)
        run: python -m pip install --disable-pip-version-check Pillow==12.1.1

      - name: 0. 이번 push 에서 바뀐 파일 적어 두기
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "앞 커밋을 알 수 없어(직접 실행 등) 직접 고친 파일 검사는 건너뜁니다."
            : > "$RUNNER_TEMP/pushed.txt"
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/pushed.txt"
          fi
          cat "$RUNNER_TEMP/pushed.txt"

      - name: 1. 새로 올린 사진 줄이기
        run: python -I _tools/process_photos.py --write

      - name: 2. 가격·사례로 홈+서비스 8장 만들기
        run: python -I _tools/build_content.py --write

      - name: 3. 지역 9장 만들기
        run: python -I _tools/build_pages.py --write

      - name: 0. 생성 파일을 직접 고친 push 인지 확인
        run: |
          # 이번 push 가 고친 .html·sitemap.xml 중에서, 방금 다시 만든 결과가 push 된 것과 다른 파일
          # = 원본(틀·content·build_pages.py)이 아니라 결과 파일만 손으로 고친 것. 그대로 두면 지워지므로 멈춘다.
          git diff --name-only > "$RUNNER_TEMP/regen.txt"
          grep -E '(\.html|^sitemap\.xml)$' "$RUNNER_TEMP/pushed.txt" | sort > "$RUNNER_TEMP/a.txt" || true
          sort "$RUNNER_TEMP/regen.txt" > "$RUNNER_TEMP/b.txt"
          hand=$(comm -12 "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt")
          if [ -n "$hand" ]; then
            echo "::error::만들어지는 파일을 직접 고친 push 입니다: $(echo $hand). 이 파일들은 _tools/src/ 틀, content/, _tools/build_pages.py 에서 만들어집니다. 그쪽을 고쳐 다시 push 하세요. 사이트는 바뀌지 않았습니다."
            git diff --stat
            exit 1
          fi
          echo "직접 고친 생성 파일 없음"

      - name: 4. 바뀐 파일 자동 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "새로 만들 것이 없습니다 (push 된 그대로 올립니다)."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git commit -q -m "자동: 가격·사례·사진으로 페이지 다시 만듦 (${GITHUB_SHA::7})"
          if git push origin HEAD:main; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::그 사이 main 에 새 커밋이 있어 이번 결과는 올리지 않습니다. 뒤이어 도는 작업이 최신 상태로 다시 만들어 올립니다."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 5-1. 올리기 준비
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: 5-2. 사이트 묶기 (지금까지와 같은 Jekyll 방식)
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: 5-3. 사장님 데이터 폴더(content/)는 사이트에서 빼기
        if: steps.commit.outputs.deploy == 'true'
        run: sudo rm -rf ./_site/content

      - name: 5-4. 묶은 사이트 올려 두기
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 5-5. GitHub Pages 에 반영
        id: deployment
        uses: actions/deploy-pages@v5
